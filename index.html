 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Magic Fruit Shop</title>
<style>
  :root{
    --pink:#FF8FA3;
    --pink-light:#FFD6E8;
    --yellow:#FFF3B0;
    --green:#CFF4D2;
    --blue:#D6F0FF;
    --text-dark:#5A4632;
    --shadow:0 8px 20px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }
 
  body{
    margin:0;
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", "Trebuchet MS", sans-serif;
    background: linear-gradient(180deg, #FFF8E7 0%, #FFEFD5 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 16px;
  }
 
  h1{
    color:var(--pink);
    text-shadow: 2px 2px 0 #fff;
    font-size: clamp(22px, 5vw, 32px);
    margin: 6px 0 4px 0;
    text-align:center;
  }
 
  .book-wrap{ width:100%; max-width: 900px; }
 
  .story-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 10px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 10px;
  }
  .speaker-btn{
    flex-shrink:0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #FFB74D;
    color:#fff;
    font-size: 20px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .speaker-btn:hover{ transform: scale(1.08); }
  .speaker-btn:active{ transform: scale(0.92); }
  .story-text{
    font-size: clamp(14px, 2.4vw, 19px);
    color: var(--text-dark);
    line-height: 1.5;
  }
 
  .stage{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(180deg, var(--blue) 0%, var(--green) 100%);
    background-size: cover;
    background-position: center;
    border-radius: 32px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 6px solid #fff;
  }
  .stage-bg-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    pointer-events:none;
  }
  .stage-bg-emoji{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12vw;
    opacity: 0.15;
    pointer-events:none;
    user-select:none;
  }
 
  .hotspot{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:hover{ transform: translate(-50%, -50%) scale(1.08); }
  .hotspot:active{ transform: translate(-50%, -50%) scale(0.95); }
 
  .hotspot-img{
    width:100%; height:100%;
    object-fit: contain;
    pointer-events:none;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
  }
  .hotspot-emoji-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size: 3.2rem;
    pointer-events:none;
  }
 
  @keyframes popBounce{
    0%   { transform: translate(-50%, -50%) scale(1); }
    30%  { transform: translate(-50%, -50%) scale(1.35) rotate(-6deg); }
    55%  { transform: translate(-50%, -50%) scale(0.9) rotate(4deg); }
    75%  { transform: translate(-50%, -50%) scale(1.15) rotate(-2deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }
  .hotspot.bounce{ animation: popBounce 0.6s ease; }
 
  .word-label{
    position:absolute;
    left:50%; top:-8px;
    transform: translate(-50%, -100%) scale(0.6);
    background: var(--pink);
    color:#fff;
    font-weight:bold;
    font-size: clamp(14px, 2.2vw, 20px);
    padding: 6px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity:0;
    white-space:nowrap;
    pointer-events:none;
    z-index: 20;
  }
  .word-label.show{ animation: labelPop 1.4s ease forwards; }
  @keyframes labelPop{
    0%   { opacity:0; transform: translate(-50%, -80%) scale(0.4); }
    15%  { opacity:1; transform: translate(-50%, -110%) scale(1.1); }
    25%  { transform: translate(-50%, -105%) scale(1); }
    80%  { opacity:1; transform: translate(-50%, -105%) scale(1); }
    100% { opacity:0; transform: translate(-50%, -130%) scale(0.9); }
  }
 
  .sparkle{
    position:absolute;
    pointer-events:none;
    font-size: 1.4rem;
    opacity:0;
    z-index: 15;
  }
  .sparkle.show{ animation: sparkleFly 0.9s ease forwards; }
  @keyframes sparkleFly{
    0%   { opacity:0; transform: translate(0,0) scale(0.3) rotate(0deg); }
    20%  { opacity:1; }
    100% { opacity:0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg); }
  }
 
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 20px;
    margin-top: 18px;
    width:100%;
  }
  .nav-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    background: var(--pink);
    color:#fff;
    border:none;
    border-radius: 50%;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
    padding: 0;
  }
  .nav-btn .arrow-icon {
    font-size: 28px;
    line-height: 1;
  }
  .nav-btn:disabled{ background:#e0b8c0; cursor:not-allowed; opacity:0.6; transform: none !important; }
  .nav-btn:not(:disabled):hover{ transform: translateY(-3px) scale(1.08); }
  .nav-btn:not(:disabled):active{ transform: translateY(0) scale(0.92); }
 
  .page-indicator{
    font-weight:bold;
    color: var(--text-dark);
    background: #fff;
    border-radius: 999px;
    padding: 10px 22px;
    box-shadow: var(--shadow);
    min-width: 90px;
    text-align:center;
    font-size: 16px;
  }
 
  .hint{
    text-align:center;
    color:#a68a6a;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>
 
<h1>🍎 The Magic Fruit Shop 🍌</h1>
 
<div class="book-wrap">
 
  <div class="story-bar">
    <button class="speaker-btn" id="speakerBtn" onclick="speakCurrentStory()" aria-label="Read the story aloud">🔊</button>
    <div class="story-text" id="storyText"></div>
  </div>
 
  <div class="stage" id="stage"></div>
 
  <div class="controls">
    <button class="nav-btn" id="prevBtn" onclick="goToPage(currentPage - 1)" aria-label="Previous Page">
      <span class="arrow-icon">⬅</span>
    </button>
    <div class="page-indicator" id="pageIndicator">1 / 10</div>
    <button class="nav-btn" id="nextBtn" onclick="goToPage(currentPage + 1)" aria-label="Next Page">
      <span class="arrow-icon">⮕</span>
    </button>
  </div>
 
  <div class="hint">
    👉 點一下 🔊 可以再聽一次故事；點角色或水果會有專屬聲音喔！<br>
    （Tap 🔊 to hear the story again. Tap characters or fruits to hear their voices!）
  </div>
</div>
 
<script>
const VOICE_PROFILES = {
  narrator: { pitch: 1.0, rate: 0.88 },
  rabbit:   { pitch: 1.55, rate: 1.15 },
  monkey:   { pitch: 1.4,  rate: 1.2  },
  elephant: { pitch: 0.55, rate: 0.75 },
  owl:      { pitch: 0.85, rate: 0.8  },
  bear:     { pitch: 0.7,  rate: 0.85 },
  fruit:    { pitch: 1.05, rate: 0.8  }
};
 
function speakEnglish(text, profileKey){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const profile = VOICE_PROFILES[profileKey] || VOICE_PROFILES.narrator;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.pitch = profile.pitch;
  utter.rate = profile.rate;
  window.speechSynthesis.speak(utter);
}
 
const PAGES = [
  {
    bgImage: "page1_forest_bg.png",
    bgEmoji: "🌳",
    text: "Once upon a time, three best friends lived in Sunny Forest. Rabbit, Monkey, and Elephant did not like fruit at all.",
    hotspots: [
      { id:"p1_rabbit",   img:"page1_rabbit_no.png", emoji:"🐰", left:"33%", top:"60.5%", width:"36%", height:"75%", label:"No, thank you!", speech:"No, thank you!", voice:"rabbit" },
      { id:"p1_monkey",   img:"page1_monkey_no.png", emoji:"🐵", left:"46%", top:"60%", width:"36%", height:"78%", label:"No fruit please!", speech:"No fruit please!", voice:"monkey" },
      { id:"p1_elephant", img:"page1_elephant_no.png", emoji:"🐘", left:"63.5%", top:"59%", width:"39%", height:"84%", label:"I don't like fruit.", speech:"I don't like fruit.", voice:"elephant" }
    ]
  },
  {
    bgImage: "page2_slide_bg.png",
    bgEmoji: "🛝",
    text: "Rabbit wanted to climb the big slide. But Rabbit felt weak. Rabbit could not climb up.",
    hotspots: [
      { id:"p2_rabbit", img:"page2_rabbit_weak.png", emoji:"🐰", left:"52%", top:"63%", width:"36%", height:"36%", label:"I feel so weak.", speech:"I feel so weak.", voice:"rabbit" }
    ]
  },
  {
    bgImage: "page3_field_bg.png",
    bgEmoji: "🌾",
    text: "Monkey wanted to run fast. But Monkey felt dizzy. Monkey tripped and fell down.",
    hotspots: [
      { id:"p3_rabbit",   img:"page3_rabbit_cheer.png", emoji:"🐰", left:"30%", top:"63.5%", width:"41.25%", height:"86.25%", label:"You can do it!", speech:"You can do it!", voice:"rabbit" },
      { id:"p3_monkey",   img:"page3_monkey_dizzy.png", emoji:"🐵", left:"48.5%", top:"62.5%", width:"39%", height:"75%", label:"Oops, I feel dizzy.", speech:"Oops, I feel dizzy.", voice:"monkey" },
      { id:"p3_elephant", img:"page3_elephant_cheer.png", emoji:"🐘", left:"65%", top:"61.5%", width:"45%", height:"101.25%", label:"Get up, Monkey!", speech:"Get up, Monkey!", voice:"elephant" }
    ]
  },
  {
    bgImage: "page4_stage_bg.png",
    bgEmoji: "🎵",
    text: "Elephant wanted to sing a song. But Elephant felt tired. No sound came out at all.",
    hotspots: [
      { id:"p4_elephant", img:"page4_elephant_notired.png", emoji:"🐘", left:"66.8%", top:"59.8%", width:"40.2%", height:"46.8%", label:"My voice is gone.", speech:"My voice is gone.", voice:"elephant" },
      { id:"p4_mic",      img:"page4_microphone.png", emoji:"🎤", left:"57.0%", top:"68.5%", width:"12.75%", height:"23.25%", label:"...", speech:"Hmm...", voice:"narrator" }
    ]
  },
  {
    bgImage: "page5_owl_bg.png",
    bgEmoji: "🦉",
    text: "The three friends sat and thought. Wise Owl flew down to help. 'Go to the Magic Fruit Shop!' said Owl.",
    hotspots: [
      { id:"p5_owl",  img:"page5_owl.png", emoji:"🦉", left:"58.6%", top:"22%", width:"36.0%", height:"35.4%", label:"Try magic fruit!", speech:"Try magic fruit!", voice:"owl" },
      { id:"p5_sign", img:"page5_signpost.png", emoji:"🪧", left:"80.6%", top:"75.4%", width:"32.4%", height:"80.1%", label:"This way!", speech:"This way!", voice:"narrator" }
    ]
  },
  {
    bgImage: "page6_shopfront_bg.png",
    bgEmoji: "🏪",
    text: "The three friends walked to the Magic Fruit Shop. Shopkeeper Bear smiled and waved. 'Welcome, friends! Let's explore fruit!'",
    hotspots: [
      { id:"p6_bear", img:"page6_bear_shopkeeper.png", emoji:"🐻", left:"52.25%", top:"60.7%", width:"39.38%", height:"81.75%", label:"Welcome, friends!", speech:"Welcome, friends!", voice:"bear" },
      { id:"p6_door", img:"page6_shop_sign.png", emoji:"🏪", left:"35.4%", top:"16%", width:"44.4%", height:"39.0%", label:"Magic Fruit Shop", speech:"Magic Fruit Shop", voice:"narrator" }
    ]
  },
  {
    bgImage: "page7_shop_inside_bg.png",
    bgEmoji: "_",
    text: "Inside the shop, fruits sparkled everywhere. Red, yellow, and orange fruits smiled at them. 'Let's try one!' said Rabbit.",
    hotspots: [
      { id:"p7_apple",      img:"fruit_apple.png", emoji:"🍎", left:"15%", top:"87.9%", width:"24%", height:"32%", label:"Apple!", speech:"Apple!", voice:"fruit" },
      { id:"p7_banana",     img:"fruit_banana.png", emoji:"🍌", left:"30%", top:"87.9%", width:"24%", height:"32%", label:"Banana!", speech:"Banana!", voice:"fruit" },
      { id:"p7_papaya",     img:"fruit_papaya.png", emoji:"🥭", left:"45%", top:"87.9%", width:"24%", height:"32%", label:"Papaya!", speech:"Papaya!", voice:"fruit" },
      { id:"p7_orange",     img:"fruit_orange.png", emoji:"🍊", left:"60%", top:"87.9%", width:"24%", height:"32%", label:"Orange!", speech:"Orange!", voice:"fruit" },
      { id:"p7_grape",      img:"fruit_grape.png", emoji:"🍇", left:"75%", top:"87.9%", width:"24%", height:"32%", label:"Grape!", speech:"Grape!", voice:"fruit" },
      { id:"p7_watermelon", img:"fruit_watermelon.png", emoji:"🍉", left:"90%", top:"87.9%", width:"24%", height:"32%", label:"Watermelon!", speech:"Watermelon!", voice:"fruit" }
    ]
  },
  {
    bgImage: "page8_apple_scene_bg.png",
    bgEmoji: "🍎",
    text: "Rabbit picked up a red apple. Rabbit took a big bite. Rabbit felt happy and strong!",
    hotspots: [
      { id:"p8_apple",         img:"fruit_apple.png", emoji:"🍎", left:"48%", top:"61%", width:"8.4%", height:"8.85%", label:"Apple!", speech:"Apple!", voice:"fruit" },
      { id:"p8_rabbit_eating", img:"page8_rabbit_eating_apple.png", emoji:"🐰", left:"26.95%", top:"77.1%", width:"60.0%", height:"120.0%", label:"Yum, so sweet!", speech:"Yum, so sweet!", voice:"rabbit" }
    ]
  },
  {
    bgImage: "page9_banana_scene_bg.png",
    bgEmoji: "🍌",
    text: "Monkey picked up a yellow banana. Monkey took a big bite. Monkey felt calm and steady!",
    hotspots: [
      { id:"p9_banana",        img:"fruit_banana.png", emoji:"🍌", left:"68%", top:"61%", width:"8.91%", height:"13.88%", label:"Banana!", speech:"Banana!", voice:"fruit" },
      { id:"p9_monkey_eating", img:"page9_monkey_eating_banana.png", emoji:"🐵", left:"44.1%", top:"64.7%", width:"40.8%", height:"69.0%", label:"Yum, so soft!", speech:"Yum, so soft!", voice:"monkey" }
    ]
  },
  {
    bgImage: "page10_celebration_bg.jpg",
    bgEmoji: "🎉",
    text: "Elephant picked up a papaya and sang a happy song! Rabbit climbed the slide. Monkey ran and laughed. Everyone loved fruit now!",
    hotspots: [
      { id:"p10_elephant", img:"page10_elephant_singing.png", emoji:"🐘", left:"58%", top:"59%", width:"52%", height:"88.4%", label:"Yum, so juicy!", speech:"Yum, so juicy!", voice:"elephant" },
      { id:"p10_rabbit",   img:"page10_rabbit_climbing.png", emoji:"🐰", left:"20%", top:"60%", width:"20.6%", height:"30%", label:"I feel strong!", speech:"I feel strong!", voice:"rabbit" },
      { id:"p10_monkey",   img:"page10_monkey_running.png", emoji:"🐵", left:"37.5%", top:"61.7%", width:"44.4%", height:"77.4%", label:"I feel great!", speech:"I feel great!", voice:"monkey" }
    ]
  }
];
 
let currentPage = 0;
 
function renderPage(index){
  const page = PAGES[index];
  document.getElementById("storyText").textContent = page.text;
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
 
  if(page.bgImage && page.bgImage.trim() !== ""){
    const bgImg = document.createElement("img");
    bgImg.className = "stage-bg-img";
    bgImg.src = page.bgImage;
    bgImg.alt = "";
    stage.appendChild(bgImg);
  } else {
    const bg = document.createElement("div");
    bg.className = "stage-bg-emoji";
    bg.textContent = page.bgEmoji;
    stage.appendChild(bg);
  }
 
  page.hotspots.forEach(spot => {
    const btn = document.createElement("button");
    btn.className = "hotspot";
    btn.id = spot.id;
    btn.style.left = spot.left;
    btn.style.top = spot.top;
    btn.style.width = spot.width;
    btn.style.height = spot.height;
    btn.setAttribute("aria-label", spot.label);
 
    if(spot.img && spot.img.trim() !== ""){
      const img = document.createElement("img");
      img.className = "hotspot-img";
      img.src = spot.img;
      img.alt = spot.label;
      btn.appendChild(img);
    } else {
      const fallback = document.createElement("div");
      fallback.className = "hotspot-emoji-fallback";
      fallback.textContent = spot.emoji;
      btn.appendChild(fallback);
    }
 
    const label = document.createElement("div");
    label.className = "word-label";
    label.textContent = spot.label;
    btn.appendChild(label);
 
    btn.addEventListener("click", () => {
      btn.classList.remove("bounce");
      void btn.offsetWidth;
      btn.classList.add("bounce");
 
      label.classList.remove("show");
      void label.offsetWidth;
      label.classList.add("show");
 
      spawnSparkles(btn);
      speakEnglish(spot.speech, spot.voice);
    });
 
    stage.appendChild(btn);
  });
 
  document.getElementById("pageIndicator").textContent = (index + 1) + " / " + PAGES.length;
  document.getElementById("prevBtn").disabled = (index === 0);
  document.getElementById("nextBtn").disabled = (index === PAGES.length - 1);
}
 
function spawnSparkles(anchorEl){
  const stage = document.getElementById("stage");
  const rect = anchorEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
 
  const centerX = rect.left - stageRect.left + rect.width / 2;
  const centerY = rect.top - stageRect.top + rect.height / 2;
  const sparkleChars = ["✨","⭐","🌟"];
 
  for(let i = 0; i < 5; i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
    s.style.left = centerX + "px";
    s.style.top = centerY + "px";
 
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 40;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
 
    stage.appendChild(s);
    void s.offsetWidth;
    s.classList.add("show");
 
    setTimeout(() => s.remove(), 950);
  }
}
 
function speakCurrentStory(){
  const page = PAGES[currentPage];
  speakEnglish(page.text, "narrator");
}
 
function goToPage(index){
  if(index < 0 || index >= PAGES.length) return;
  currentPage = index;
  renderPage(currentPage);
  speakCurrentStory();
}
 
renderPage(currentPage);
speakCurrentStory();
</script>
</body>
</html>
